services:
  # Backend API Web Service
  - type: web
    name: medtransfer-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medtransfer-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: medtransfer-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://medtransfer-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: medtransfer-db
    databaseName: medtransfer_db
    user: medtransfer_user
    plan: free
